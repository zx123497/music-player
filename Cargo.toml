[package]
name = "music-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["full"] }
tower = "0.5.3"
figment = { version = "0.10.19", features = ["toml", "env"] }
aws-sdk-s3 = { version = "1.131.0", features = ["behavior-version-latest"] }
tower-http = { version = "0.6.8", features = ["trace", "cors", "limit", "timeout"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "macros"] }
dotenvy = "0.15.7"
uuid = { version = "1.23.1", features = ["v4"] }
